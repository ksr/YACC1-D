site_name: YACC1 — Yet Another Custom CPU
site_description: A hand-built 8-bit TTL computer, its microcode, ROM, operating system and C compiler.
site_author: Ken Rother
repo_url: https://github.com/ksr/YACC1-D
repo_name: ksr/YACC1-D
edit_uri: blob/main/
docs_dir: stage
site_dir: site
use_directory_urls: true
copyright: "YACC1 by Ken Rother — <a href=\"https://cottageworker.com\">cottageworker.com</a> · Email ken at cottage worker dot com"
not_in_nav: |
  /docs/isa/*.md
hooks:
  - hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc: {permalink: true}
  - admonition
  - pymdownx.superfences
  - pymdownx.details

