; pcb-check's settings for the video card V4.0 (~/Developer/pcb-check: the check before any order).
;   pcb-check video-v4.0.kicad_pcb video-v4.0-gerbers.zip --layers 4 [--tests]
[board]
name = YACC1 Video Card V4.0
rev = 4.0
size = 250 x 113.97
; the bus connector X1 stands along the left edge; the front edge is the right one
bus_edge = left
; the bus's pinout, from the Bus Template V3.2
bus_pins = python3 ../../../../../tools/bus_pins.py
; the system's tests (about 11 minutes; the C tools built first, by make)
tests = cd ../../../../.. && make && make check
